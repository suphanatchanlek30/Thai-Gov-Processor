# Two issuers on purpose: staging first, so a misconfiguration (wrong DNS,
# port 80 blocked) burns the generous staging limits instead of Let's
# Encrypt's production rate limits (5 failed validations/hour/host, and
# only 5 duplicate certs/week). Staging certs are signed by an untrusted
# CA, so browsers will warn - that is expected. Switch the Ingress
# annotation to letsencrypt-prod once staging issues cleanly.
#
# No `email` on purpose: it goes to a third party and is only used for
# expiry warnings, which cert-manager makes unnecessary by renewing at
# 2/3 of the cert's lifetime.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
