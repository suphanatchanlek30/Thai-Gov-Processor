apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: thai-gov-staging
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-deployed.discord: ""
    notifications.argoproj.io/subscribe.on-sync-failed.discord: ""
  finalizers:
    # Deleting the Application also deletes what it deployed, instead of
    # leaving orphaned resources that nothing manages any more.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/suphanatchanlek30/Thai-Gov-Processor.git
    targetRevision: staging
    path: k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: thai-gov-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
