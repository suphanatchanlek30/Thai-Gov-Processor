apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  # No replicas: the HPA owns the count. A value here would make Argo CD's
  # self-heal reset the HPA's scale-out on every sync.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # New pod must be Ready before an old one is removed, so a deploy
      # (or a deleted pod) never drops capacity below the replica count.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          # Placeholder name; the prod overlay's `images:` block swaps in the
          # ECR URL and the tag Jenkins built.
          image: thai-gov-processor-backend
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
