apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - backend-deployment.yaml
  - frontend-deployment.yaml
  - services.yaml
  - backend-hpa.yaml
  - smoke-test-job.yaml

# Only environment-agnostic settings live here. S3_BUCKET and
# CORS_ALLOWED_ORIGINS differ per environment, so the prod overlay adds them.
# No S3 keys: on AWS the backend falls back to the EC2 instance role.
configMapGenerator:
  - name: backend-config
    literals:
      - S3_REGION=ap-southeast-1
