apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: thai-gov

resources:
  - ../../base
  - namespace.yaml

# Jenkins rewrites newTag on every main build (kustomize edit set image).
# The tag below is a placeholder: ECR tags are IMMUTABLE and no app image has
# been pushed yet, so pods stay in ImagePullBackOff until the first build.
images:
  - name: thai-gov-processor-backend
    newName: 334177992720.dkr.ecr.ap-southeast-1.amazonaws.com/thai-gov-processor-backend
    newTag: placeholder
  - name: thai-gov-processor-frontend
    newName: 334177992720.dkr.ecr.ap-southeast-1.amazonaws.com/thai-gov-processor-frontend
    newTag: placeholder

configMapGenerator:
  - name: backend-config
    behavior: merge
    literals:
      - S3_BUCKET=thai-gov-processor-uploads-334177992720
      - CORS_ALLOWED_ORIGINS=https://app.52-74-96-78.sslip.io
